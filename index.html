<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C172 Traffic Pattern Trainer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Cessna 172 · Trainer</h1>
    <div class="modes">
      <button id="modePattern" class="btn mode active">Pattern</button>
      <button id="modeEmergency" class="btn mode">Emergencies</button>
    </div>
    <div class="controls">
      <span id="progressText" class="progress"></span>
      <button id="scenarioBtn" class="btn" hidden>Scenarios</button>
      <button id="startBtn" class="btn primary">Start</button>
      <button id="restartBtn" class="btn" hidden>Restart</button>
    </div>
  </header>

  <main class="layout">
    <!-- LEFT: cockpit panel (relative — value popover anchors to controls here) -->
    <section class="cockpit-wrap">
      <div id="cockpit" class="cockpit"></div>
      <div id="valuePopover" class="popover" hidden>
        <div id="popTitle" class="pop-title"></div>
        <div id="popOptions" class="pop-options"></div>
      </div>
    </section>

    <!-- RIGHT: conditions + minimap (pattern) / checklist (emergencies) -->
    <aside class="side">
      <div id="phaseBanner" class="phase-banner">READY</div>

      <div class="action-card">
        <p id="conditionsLabel" class="conditions-label">CONDITIONS</p>
        <p id="conditions" class="conditions"></p>
        <p id="stateLine" class="state-line" hidden></p>
        <p id="prompt" class="prompt"></p>
        <div id="feedback" class="feedback" hidden></div>

        <!-- emergency branch points ("If risk of fire...") -->
        <div id="decisionBox" class="decision-box" hidden></div>
        <!-- pointer to another checklist ("Forced Landing Checklist") -->
        <div id="handoffBox" class="handoff-box" hidden></div>

        <div class="card-actions">
          <button id="hintBtn" class="btn hint" hidden>Show hint</button>
          <button id="revealBtn" class="btn reveal" hidden>Read the checklist</button>
          <button id="goaroundBtn" class="btn danger" hidden>⤴ Go Around</button>
        </div>
        <div id="goaroundHint" class="goaround-hint" hidden>
          <strong>Go around if:</strong> not stabilized (speed · glidepath · centerline) ·
          runway not clear · too high or too fast · balloon or bounce in the flare.
        </div>
        <div id="hintBox" class="hint-box" hidden></div>
        <div id="debriefBox" class="debrief-box" hidden></div>
        <button id="beginBtn" class="btn primary wide" hidden>Begin</button>
        <button id="nextBtn" class="btn primary wide" hidden>Next emergency</button>
      </div>

      <div id="minimapBox" class="minimap-box">
        <div id="minimap" class="minimap-holder"></div>
      </div>

      <div id="emergencyBox" class="emergency-box" hidden>
        <p class="conditions-label">CHECKLIST</p>
        <ol id="checklist" class="checklist"></ol>
        <p id="checklistNote" class="checklist-note" hidden></p>
      </div>
    </aside>
  </main>

  <!-- scenario picker -->
  <div id="pickerOverlay" class="picker-overlay" hidden>
    <div class="picker">
      <div class="picker-top">
        <h2>Choose what to drill</h2>
        <button id="pickerClose" class="btn primary">Done</button>
      </div>
      <div class="picker-actions">
        <button id="pickAll" class="btn small">All</button>
        <button id="pickNone" class="btn small">None</button>
        <span id="pickCount" class="progress"></span>
      </div>
      <div id="pickerGroups" class="picker-groups"></div>
    </div>
  </div>

  <script src="js/sequence.js"></script>
  <script src="js/emergencies.js"></script>
  <script src="js/cockpit.js"></script>
  <script src="js/minimap.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/emergency.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
